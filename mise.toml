# Build-and-install tasks for enMirror (`mise tasks` lists them). Device and simulator IDs are per
# machine: put them in mise.local.toml (gitignored), for example
#
#   [env]
#   ENMIRROR_SIM = "<UDID of the simulator>"   # xcrun simctl list devices
#   ENMIRROR_DEVICES = "<UDID> <UDID>"         # iPhones, space-separated: xcrun devicectl list devices
#
# Signing for the iPhone comes from ios/Config/Local.xcconfig (README.md, "Running on an iPhone").

# Code checks run by ios/scripts/ci-ios.sh (docs/conventions.md, "Tooling"). swift-format comes with Xcode.
[tools]
"aqua:realm/SwiftLint" = "0.65.1"
"aqua:peripheryapp/periphery" = "3.8.0"

# iOS paths are relative to ios/, where every ios:* task runs.
[env]
ENMIRROR_PROJECT = "EnMirror.xcodeproj"
ENMIRROR_BUNDLE_ID = "com.trinhvaphuong.enmirror"
ENMIRROR_SIM_DERIVED = "build/xcode-sim"
ENMIRROR_DEVICE_DERIVED = "build/xcode-device"

[tasks."ios:build-sim"]
description = "Build the Debug app for the simulator"
dir = "ios"
run = """
set -euo pipefail
: "${ENMIRROR_SIM:?set ENMIRROR_SIM in mise.local.toml}"
xcodebuild build -quiet -project "$ENMIRROR_PROJECT" -scheme EnMirror \
  -destination "platform=iOS Simulator,id=$ENMIRROR_SIM" -derivedDataPath "$ENMIRROR_SIM_DERIVED"
"""

[tasks."ios:sim"]
description = "Build, then install and launch on the simulator (boots it)"
dir = "ios"
depends = ["ios:build-sim"]
run = """
set -euo pipefail
open -b com.apple.iphonesimulator 2>/dev/null || true
xcrun simctl boot "$ENMIRROR_SIM" 2>/dev/null || true
xcrun simctl install "$ENMIRROR_SIM" "$ENMIRROR_SIM_DERIVED/Build/Products/Debug-iphonesimulator/EnMirror.app"
xcrun simctl launch "$ENMIRROR_SIM" "$ENMIRROR_BUNDLE_ID"
"""

[tasks."ios:build-device"]
description = "Build the Debug app for the iPhones in ENMIRROR_DEVICES"
dir = "ios"
run = """
set -uo pipefail
devices=${ENMIRROR_DEVICES:-${ENMIRROR_DEVICE:-}}
: "${devices:?set ENMIRROR_DEVICES in mise.local.toml}"
# One build per iPhone so each one is registered and lands in the development profile; after the
# first, the build is incremental and only re-signs. An iPhone that is not paired or reachable is
# skipped, so it does not stop the others; the task fails only if no build succeeded.
built=0
for id in $devices; do
  log="$ENMIRROR_DEVICE_DERIVED/build-$id.log"
  mkdir -p "$ENMIRROR_DEVICE_DERIVED"
  if xcodebuild build -quiet -project "$ENMIRROR_PROJECT" -scheme EnMirror \
    -destination "platform=iOS,id=$id" -derivedDataPath "$ENMIRROR_DEVICE_DERIVED" \
    -allowProvisioningUpdates -allowProvisioningDeviceRegistration >"$log" 2>&1; then
    built=1
  else
    grep -v "DVTDevice" "$log" | tail -5
    echo "skipped $id: not paired, locked or not connected (log: ios/$log)"
  fi
done
[ "$built" = 1 ]
"""

[tasks."ios:devices"]
description = "Build, then install and launch on every iPhone in ENMIRROR_DEVICES (unlocked, by cable or Wi-Fi)"
dir = "ios"
depends = ["ios:build-device"]
run = """
set -uo pipefail
devices=${ENMIRROR_DEVICES:-${ENMIRROR_DEVICE:-}}
app="$ENMIRROR_DEVICE_DERIVED/Build/Products/Debug-iphoneos/EnMirror.app"
failed=0
for id in $devices; do
  echo "== $id"
  # One iPhone that is locked or away must not stop the others (mise runs scripts with errexit,
  # so every step that may fail is guarded).
  if xcrun devicectl device install app --device "$id" "$app" 2>&1 | grep -q "App installed"; then
    echo "installed"
    if xcrun devicectl device process launch --device "$id" "$ENMIRROR_BUNDLE_ID" >/dev/null 2>&1; then
      echo "launched"
    else
      echo "installed but not launched: unlock the iPhone and open enMirror"
    fi
  else
    echo "could not install on $id (locked, not trusted, Developer Mode off or not connected?)"
    failed=1
  fi
done
exit $failed
"""

[tasks."ios:test"]
description = "Run the unit tests on the simulator"
dir = "ios"
run = """
set -euo pipefail
: "${ENMIRROR_SIM:?set ENMIRROR_SIM in mise.local.toml}"
xcodebuild test -quiet -project "$ENMIRROR_PROJECT" -scheme EnMirror \
  -destination "platform=iOS Simulator,id=$ENMIRROR_SIM" -derivedDataPath "$ENMIRROR_SIM_DERIVED"
"""

[tasks."ios:format"]
description = "Format the Swift in place with swift-format (.swift-format)"
dir = "ios"
run = "scripts/ios-swift-files.sh | xargs -0 xcrun swift-format format --in-place --parallel"

[tasks."ios:lint"]
description = "Check the Swift: swift-format, then SwiftLint"
dir = "ios"
run = """
set -euo pipefail
scripts/ios-swift-files.sh | xargs -0 xcrun swift-format lint --strict --parallel
swiftlint lint --quiet --strict
"""

[tasks."ios:store"]
description = "App Store screenshots and creative (EN + VI): capture on the simulator, then compose"
dir = "ios"
run = """
set -euo pipefail
scripts/store-capture.sh
uv run scripts/store-screenshots.py
uv run scripts/store-creative.py
"""

[tasks."ios:dead-code"]
description = "List unused Swift declarations with Periphery (builds for the simulator first)"
dir = "ios"
run = """
set -euo pipefail
xcodebuild build -quiet -project "$ENMIRROR_PROJECT" -scheme EnMirror -destination "generic/platform=iOS Simulator" \
  -derivedDataPath "build/ci-ios/iOS Simulator" CODE_SIGNING_ALLOWED=NO
periphery scan --quiet --relative-results --index-store-path "build/ci-ios/iOS Simulator/Index.noindex/DataStore"
"""

[tasks."testflight:build"]
description = "Archive and export the Release .ipa under build/testflight without uploading"
dir = "ios"
run = "scripts/testflight.sh"

[tasks."testflight:upload"]
description = "Archive the Release build and upload it to App Store Connect (TestFlight)"
dir = "ios"
run = "scripts/testflight.sh --upload"

# Landing site (web/apps/landing, docs in its README). Deploying publishes enmirror.trinhvaphuong.com.
[tasks."web:dev"]
description = "Run the landing site's Vite dev server"
dir = "web"
run = "bun run dev"

[tasks."web:build"]
description = "Build and prerender the landing site into web/apps/landing/dist"
dir = "web"
run = "bun run build"

[tasks."web:preview"]
description = "Build, then serve dist/ with wrangler dev as Cloudflare would"
dir = "web/apps/landing"
run = "bun run preview"

[tasks."web:deploy"]
description = "Release build (fails on placeholders), then wrangler deploy to enmirror.trinhvaphuong.com"
dir = "web"
run = "bun run deploy"

[tasks."ios:ci"]
description = "Every iOS check (ios/scripts/ci-ios.sh)"
run = "ios/scripts/ci-ios.sh"

[tasks."web:ci"]
description = "Every landing check (web/scripts/ci-web.sh)"
run = "web/scripts/ci-web.sh"
